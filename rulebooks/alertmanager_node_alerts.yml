---
- name: Respond to OpenShift node alerts
  hosts: all

  sources:
    - name: openshift_alertmanager
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
      filters:
        - eda.builtin.event_splitter:
            splitter_key: payload.alerts

  rules:
    - name: Launch workflow for a firing node alert
      condition:
        all:
          - event.status == "firing"
          - event.labels.automation_target == "eda"
          - event.labels.node is defined
          - event.labels.cluster is defined
          - >-
            event.labels.alertname == "EDANodeNotReady" or
            event.labels.alertname == "EDANodeUnschedulable"

      action:
        print_event:
          pretty: true

        # debug:
        #   msg: >-
        #     Received {{ event.labels.alertname }}
        #     for {{ event.labels.cluster }}/{{ event.labels.node }}
        #     with status {{ event.status }}

        # run_workflow_template:
        #   name: "{{ workflow_template_name }}"
        #   organization: "{{ workflow_organization }}"
        #   include_events: true
        #   extra_vars:
        #     openshift_cluster: "{{ event.labels.cluster }}"
        #     openshift_node: "{{ event.labels.node }}"
        #     openshift_alert_name: "{{ event.labels.alertname }}"
        #     openshift_alert_status: "{{ event.status }}"
        #     openshift_alert_started_at: "{{ event.startsAt }}"
