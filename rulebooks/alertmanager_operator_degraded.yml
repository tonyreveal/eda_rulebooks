---
- name: Respond to OpenShift Cluster Operator degradation
  hosts: all

  sources:
    - name: openshift_alertmanager
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
      filters:
        - eda.builtin.event_splitter:
            splitter_key: payload.alerts

  rules:
    - name: Display firing Cluster Operator degraded alert
      condition:
        all:
          - event.status == "firing"
          - event.labels.automation_target == "eda"
          - event.labels.alertname == "EDAClusterOperatorDegraded"
      action:
        debug:
          msg: >-
            CLUSTER OPERATOR DEGRADED:
            cluster={{ event.labels.cluster }}
            operator={{ event.labels.name }}
            message={{ event.annotations.message }}

    - name: Display resolved Cluster Operator degraded alert
      condition:
        all:
          - event.status == "resolved"
          - event.labels.automation_target == "eda"
          - event.labels.alertname == "EDAClusterOperatorDegraded"
      action:
        debug:
          msg: >-
            CLUSTER OPERATOR DEGRADATION ALERT RESOLVED:
            cluster={{ event.labels.cluster }}
            operator={{ event.labels.name }}
...
