---
- name: Respond to OpenShift repeated container restarts
  hosts: all

  sources:
    - name: openshift_alertmanager
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
      filters:
        - eda.builtin.event_splitter:
            splitter_key: payload.alerts

  rules:
    - name: Display firing container restart alert
      condition:
        all:
          - event.status == "firing"
          - event.labels.automation_target == "eda"
          - event.labels.alertname == "EDAContainerRepeatedRestarts"
      action:
        debug:
          msg: >-
            CONTAINER RESTARTS FIRING:
            cluster={{ event.labels.cluster }}
            namespace={{ event.labels.namespace }}
            pod={{ event.labels.pod }}
            container={{ event.labels.container }}
            uid={{ event.labels.uid }}
            message={{ event.annotations.message }}

    - name: Display resolved container restart alert
      condition:
        all:
          - event.status == "resolved"
          - event.labels.automation_target == "eda"
          - event.labels.alertname == "EDAContainerRepeatedRestarts"
      action:
        debug:
          msg: >-
            CONTAINER RESTARTS RESOLVED:
            cluster={{ event.labels.cluster }}
            namespace={{ event.labels.namespace }}
            pod={{ event.labels.pod }}
            container={{ event.labels.container }}
            uid={{ event.labels.uid }}
...
