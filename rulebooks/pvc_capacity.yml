---
- name: Respond to OpenShift PVC capacity alerts
  hosts: all

  sources:
    - name: openshift_alertmanager
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
      filters:
        - eda.builtin.event_splitter:
            splitter_key: payload.alerts

  rules:
    - name: Display firing PVC capacity alert
      condition:
        all:
          - event.status == "firing"
          - event.labels.automation_target == "eda"
          - event.labels.alertname == "EDAPVCApproachingCapacity"
      action:
        debug:
          msg: >-
            PVC CAPACITY FIRING:
            cluster={{ event.labels.cluster }}
            namespace={{ event.labels.namespace }}
            pvc={{ event.labels.persistentvolumeclaim }}
            message={{ event.annotations.message }}

    - name: Display resolved PVC capacity alert
      condition:
        all:
          - event.status == "resolved"
          - event.labels.automation_target == "eda"
          - event.labels.alertname == "EDAPVCApproachingCapacity"
      action:
        debug:
          msg: >-
            PVC CAPACITY RESOLVED:
            cluster={{ event.labels.cluster }}
            namespace={{ event.labels.namespace }}
            pvc={{ event.labels.persistentvolumeclaim }}
...
